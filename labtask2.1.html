<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Task 02</title>

  <style>
    /* Group selector */
    h1, h2 {
      color: darkblue;
    }

    /* Descendant selector */
    div p {
      font-size: 1.2em;
      color: green;
    }

    /* Attribute selector */
    input[type="text"] {
      width: 50%;
      padding: 10px;
      font-size: 1rem;
    }

    /* Units */
    .box {
      width: 60%;
      height: 20vh;
      background-color: lightgray;
      margin: 20px;
      padding: 1em;
      border: 5px solid black;
    }

    /* Pseudo-classes */
    button:hover {
      background-color: black;
      color: white;
    }

    input:focus {
      border: 2px solid blue;
    }

    a:active {
      color: red;
    }
  </style>
</head>
<body>

  <h1>Data</h1>
  <h2>Information</h2>

  <div class="box">
    <p>My name is Jeba Tasnim.</p>
  </div>

  <input type="text" placeholder="Type here">
  <br><br>

  <button>submit</button>
  <br><br>

  <a href="#">Introduction</a>

</body>
</html>
