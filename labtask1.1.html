<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Task 01</title>

  <style>
    /* Universal selector */
    * {
      margin: 0;
      padding: 0;
    }

    /* Element selector */
    h1 {
      color: green;
      text-align: center;
    }

    p {
      color: blue;
      font-size: 18px;
    }

    /* Class selector */
    .highlight {
      background-color: yellow;
      font-family: Arial, sans-serif;
    }

    /* ID selector */
    #mainTitle {
      background-color: lightgray;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>

  <h1 id="mainTitle">Welcome to Personal Data</h1>

  <p>My name is Jeba Tasnim. I'm from Rajshahi.</p>

  <p class="highlight">My hometown is Rajshahi.I live in Dhaka.</p>

  <!-- Inline CSS -->
  <h2 style="color: red; text-align: center;">My Personal Information</h2>
  <p>I love playing Badminton and enjoy reading books</p>
</body>
</html>
